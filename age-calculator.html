
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculate your exact age in years, months and days with ToolNest.">
    <title>Age Calculator - ToolNest</title>

    <style>
        :root {
            --bg: #0B1020;
            --card: #171B35;
            --accent: #A78BFA;
            --blue: #38BDF8;
            --text: #FFFFFF;
            --muted: #AAB4D0;
            --border: rgba(255,255,255,0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #25204D, var(--bg) 60%);
            color: var(--text);
        }

        nav {
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11,16,32,0.85);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(15px);
        }

        .logo {
            color: var(--accent);
            font-size: 27px;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover { color: var(--accent); }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 75px auto;
            text-align: center;
        }

        .tag {
            display: inline-block;
            padding: 9px 17px;
            border: 1px solid rgba(167,139,250,0.35);
            background: rgba(167,139,250,0.1);
            color: var(--accent);
            border-radius: 30px;
            font-size: 13px;
            margin-bottom: 22px;
        }

        h1 {
            font-size: clamp(32px, 6vw, 45px);
            margin-bottom: 12px;
        }

        h1 span { color: var(--accent); }

        .description {
            color: var(--muted);
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .calculator {
            background: rgba(23,27,53,0.9);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 35px;
            text-align: left;
            box-shadow: 0 15px 45px rgba(0,0,0,0.2);
        }

        label {
            display: block;
            color: var(--muted);
            margin-bottom: 12px;
            font-size: 14px;
        }

        input[type="date"] {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.06);
            color: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            color-scheme: dark;
        }

        input[type="date"]:focus {
            border-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: var(--accent);
            color: #0B1020;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: var(--blue);
            transform: translateY(-2px);
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 22px;
            border: 1px solid rgba(167,139,250,0.3);
            background: rgba(167,139,250,0.08);
            border-radius: 14px;
            text-align: center;
        }

        .result h2 {
            color: var(--accent);
            font-size: 22px;
            margin-bottom: 20px;
        }

        .age-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .age-box {
            background: rgba(255,255,255,0.06);
            padding: 18px 5px;
            border-radius: 10px;
        }

        .age-box strong {
            display: block;
            font-size: 30px;
            color: var(--blue);
            margin-bottom: 7px;
        }

        .age-box span {
            color: var(--muted);
            font-size: 12px;
        }

        .message {
            color: #FCA5A5;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }

        .reset-btn {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }

        .reset-btn:hover {
            color: white;
            background: rgba(255,255,255,0.08);
        }

        footer {
            text-align: center;
            padding: 25px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.8;
        }

        footer span { color: var(--accent); }

        @media(max-width: 500px) {
            .calculator { padding: 23px 18px; }
            .container { margin: 50px auto; }
            .age-box strong { font-size: 24px; }
            nav { padding: 18px 5%; }
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html" class="logo">ToolNest.</a>
    <a href="../index.html#tools" class="back-link">← Back to Tools</a>
</nav>

<main class="container">

    <div class="tag">🎂 Daily Life Tool</div>

    <h1>Age <span>Calculator</span></h1>

    <p class="description">
        Enter your date of birth to calculate your exact age
        in years, months and days.
    </p>

    <div class="calculator">

        <label for="birthDate">Select Your Date of Birth</label>

        <input type="date" id="birthDate">

        <p class="message" id="errorMessage" role="alert"></p>

        <button id="calculateBtn">Calculate My Age</button>

        <div class="result" id="result" aria-live="polite">
            <h2>Your Exact Age</h2>

            <div class="age-grid">
                <div class="age-box">
                    <strong id="years">0</strong>
                    <span>Years</span>
                </div>

                <div class="age-box">
                    <strong id="months">0</strong>
                    <span>Months</span>
                </div>

                <div class="age-box">
                    <strong id="days">0</strong>
                    <span>Days</span>
                </div>
            </div>
        </div>

        <button class="reset-btn" id="resetBtn">Clear</button>

    </div>

</main>

<footer>
    © 2026 ToolNest. All rights reserved.<br>
    A Product by <span>DeltaCode</span>
</footer>

<script>
const birthDateInput = document.getElementById("birthDate");
const calculateBtn = document.getElementById("calculateBtn");
const resetBtn = document.getElementById("resetBtn");
const result = document.getElementById("result");
const errorMessage = document.getElementById("errorMessage");

function getLocalDate() {
    const now = new Date();

    return new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
    );
}

const today = getLocalDate();

const year = today.getFullYear();
const month = String(today.getMonth() + 1).padStart(2, "0");
const day = String(today.getDate()).padStart(2, "0");

birthDateInput.max = `${year}-${month}-${day}`;

function showError(message) {
    errorMessage.textContent = message;
    errorMessage.style.display = "block";
    result.style.display = "none";
}

function calculateAge() {
    const value = birthDateInput.value;

    if (!value) {
        showError("Please select your date of birth.");
        return;
    }

    const parts = value.split("-").map(Number);

    const birth = new Date(
        parts[0],
        parts[1] - 1,
        parts[2]
    );

    if (
        birth.getFullYear() !== parts[0] ||
        birth.getMonth() !== parts[1] - 1 ||
        birth.getDate() !== parts[2]
    ) {
        showError("Please enter a valid date.");
        return;
    }

    if (birth > today) {
        showError("Date of birth cannot be in the future.");
        return;
    }

    let years = today.getFullYear() - birth.getFullYear();
    let months = today.getMonth() - birth.getMonth();
    let days = today.getDate() - birth.getDate();

    if (days < 0) {
        months--;

        const previousMonthDays = new Date(
            today.getFullYear(),
            today.getMonth(),
            0
        ).getDate();

        days += previousMonthDays;
    }

    if (months < 0) {
        years--;
        months += 12;
    }

    document.getElementById("years").textContent = years;
    document.getElementById("months").textContent = months;
    document.getElementById("days").textContent = days;

    errorMessage.style.display = "none";
    result.style.display = "block";
}

function clearCalculator() {
    birthDateInput.value = "";
    result.style.display = "none";
    errorMessage.style.display = "none";
}

calculateBtn.addEventListener("click", calculateAge);
resetBtn.addEventListener("click", clearCalculator);
</script>

</body>
</html>
