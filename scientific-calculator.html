<script>
const expressionDisplay = document.getElementById("expression");
const resultDisplay = document.getElementById("result");
const buttons = document.getElementById("buttons");
const angleButton = document.getElementById("angleMode");
const historyList = document.getElementById("historyList");

let expression = "";
let lastAnswer = 0;
let angleMode = "DEG";
let history = [];

function updateDisplay() {
    expressionDisplay.textContent = expression || "Ready";
}

function insertValue(value) {
    expression += value;
    updateDisplay();
}

function clearAll() {
    expression = "";
    resultDisplay.textContent = "0";
    expressionDisplay.textContent = "Ready";
}

function deleteLast() {
    if (!expression) return;

    const functions = [
        "asin(", "acos(", "atan(", "sqrt(",
        "sin(", "cos(", "tan(", "log(", "ln(", "abs("
    ];

    const found = functions.find(fn => expression.endsWith(fn));

    if (found) {
        expression = expression.slice(0, -found.length);
    } else {
        expression = expression.slice(0, -1);
    }

    updateDisplay();
}

angleButton.addEventListener("click", () => {
    angleMode = angleMode === "DEG" ? "RAD" : "DEG";
    angleButton.textContent = angleMode;
});

buttons.addEventListener("click", event => {
    const button = event.target.closest("button");
    if (!button) return;

    const value = button.dataset.value;
    const action = button.dataset.action;

    if (action === "clear") return clearAll();
    if (action === "delete") return deleteLast();

    if (action === "ans") {
        insertValue(String(lastAnswer));
        return;
    }

    if (action === "calculate") {
        calculate();
        return;
    }

    if (value !== undefined) insertValue(value);
});

/* Safe mathematical parser - does not use eval() */

function tokenize(input) {
    input = input.replaceAll("π", "pi");

    const tokens = [];
    let i = 0;

    while (i < input.length) {
        const remaining = input.slice(i);

        if (/^\s+/.test(remaining)) {
            i += remaining.match(/^\s+/)[0].length;
            continue;
        }

        const number = remaining.match(/^(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?/i);
        if (number) {
            tokens.push({ type: "number", value: Number(number[0]) });
            i += number[0].length;
            continue;
        }

        const identifier = remaining.match(/^[a-zA-Z]+/);
        if (identifier) {
            tokens.push({ type: "name", value: identifier[0].toLowerCase() });
            i += identifier[0].length;
            continue;
        }

        const char = input[i];

        if ("+-*/^()%!".includes(char)) {
            tokens.push({ type: "operator", value: char });
            i++;
            continue;
        }

        throw new Error("Invalid character: " + char);
    }

    return tokens;
}

function evaluate(input) {
    const tokens = tokenize(input);
    let position = 0;

    function peek() {
        return tokens[position];
    }

    function take(value) {
        if (peek() && peek().value === value) {
            position++;
            return true;
        }
        return false;
    }

    function expect(value) {
        if (!take(value)) throw new Error("Expected " + value);
    }

    function factorial(n) {
        if (!Number.isInteger(n) || n < 0 || n > 170) {
            throw new Error("Factorial requires an integer from 0 to 170");
        }
        let answer = 1;
        for (let i = 2; i <= n; i++) answer *= i;
        return answer;
    }

    function angle(value) {
        return angleMode === "DEG" ? value * Math.PI / 180 : value;
    }

    function inverseAngle(value) {
        return angleMode === "DEG" ? value * 180 / Math.PI : value;
    }

    function primary() {
        if (take("+")) return primary();
        if (take("-")) return -primary();

        if (take("(")) {
            const value = addSub();
            expect(")");
            return value;
        }

        const token = peek();

        if (!token) throw new Error("Incomplete expression");

        if (token.type === "number") {
            position++;
            return token.value;
        }

        if (token.type === "name") {
            position++;
            const name = token.value;

            if (name === "pi") return Math.PI;
            if (name === "e") return Math.E;

            const functions = [
                "sin", "cos", "tan", "asin", "acos",
                "atan", "sqrt", "log", "ln", "abs"
            ];

            if (!functions.includes(name)) {
                throw new Error("Unknown function: " + name);
            }

            expect("(");
            const value = addSub();
            expect(")");

            switch (name) {
                case "sin": return Math.sin(angle(value));
                case "cos": return Math.cos(angle(value));
                case "tan":
                    if (Math.abs(Math.cos(angle(value))) < 1e-12) {
                        throw new Error("Tangent is undefined");
                    }
                    return Math.tan(angle(value));
                case "asin":
                    if (value < -1 || value > 1) throw new Error("Input must be between -1 and 1");
                    return inverseAngle(Math.asin(value));
                case "acos":
                    if (value < -1 || value > 1) throw new Error("Input must be between -1 and 1");
                    return inverseAngle(Math.acos(value));
                case "atan": return inverseAngle(Math.atan(value));
                case "sqrt":
                    if (value < 0) throw new Error("Invalid square root");
                    return Math.sqrt(value);
                case "log":
                    if (value <= 0) throw new Error("Log input must be positive");
                    return Math.log10(value);
                case "ln":
                    if (value <= 0) throw new Error("Ln input must be positive");
                    return Math.log(value);
                case "abs": return Math.abs(value);
            }
        }

        throw new Error("Invalid expression");
    }

    function postfix() {
        let value = primary();

        while (true) {
            if (take("!")) {
                value = factorial(value);
            } else if (take("%")) {
                value /= 100;
            } else {
                break;
            }
        }

        return value;
    }

    function power() {
        let value = postfix();

        if (take("^")) {
            value = Math.pow(value, power());
        }

        return value;
    }

    function multiplyDivide() {
        let value = power();

        while (true) {
            if (take("*")) {
                value *= power();
            } else if (take("/")) {
                const divisor = power();
                if (divisor === 0) throw new Error("Cannot divide by zero");
                value /= divisor;
            } else {
                break;
            }
        }

        return value;
    }

    function addSub() {
        let value = multiplyDivide();

        while (true) {
            if (take("+")) {
                value += multiplyDivide();
            } else if (take("-")) {
                value -= multiplyDivide();
            } else {
                break;
            }
        }

        return value;
    }

    if (tokens.length === 0) throw new Error("Enter a calculation");

    const answer = addSub();

    if (position !== tokens.length) {
        throw new Error("Check your expression");
    }

    if (!Number.isFinite(answer)) {
        throw new Error("Result is not finite");
    }

    return answer;
}

function calculate() {
    if (!expression.trim()) return;

    try {
        const originalExpression = expression;
        const normalized = expression.replaceAll("×", "*").replaceAll("÷", "/");
        const answer = evaluate(normalized);

        lastAnswer = answer;

        const formatted = Number(answer.toPrecision(12)).toString();

        resultDisplay.textContent = formatted;

        history.unshift(originalExpression + " = " + formatted);
        history = history.slice(0, 8);

        historyList.innerHTML = "";

        history.forEach(item => {
            const row = document.createElement("div");
            row.textContent = item;
            historyList.appendChild(row);
        });

        expression = formatted;
        updateDisplay();

    } catch (error) {
        resultDisplay.textContent = error.message;
    }
}

/* Keyboard support */

document.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === "=") {
        event.preventDefault();
        calculate();
    } else if (event.key === "Escape") {
        clearAll();
    } else if (event.key === "Backspace") {
        deleteLast();
    } else if (/^[0-9.]$/.test(event.key)) {
        insertValue(event.key);
    } else if ("+-*/^()%!".includes(event.key)) {
        insertValue(event.key);
    }
});
</script>

</body>
</html>
