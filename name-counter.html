
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Name Counter | ToolNest</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #292052, #0b1026 65%);
    color: white;
    min-height: 100vh;
    padding: 25px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 950px;
    margin: auto;
    padding: 15px 0 35px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #a78bfa;
}

header a {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 750px;
    margin: 45px auto;
    text-align: center;
}

h1 {
    font-size: 40px;
    margin-bottom: 12px;
}

h1 span {
    color: #a78bfa;
}

.subtitle {
    color: #aab4d0;
    margin-bottom: 35px;
}

.counter-box {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 30px;
    backdrop-filter: blur(15px);
}

textarea {
    width: 100%;
    height: 130px;
    resize: vertical;
    background: rgba(255,255,255,0.07);
    border: 1px solid #514477;
    border-radius: 12px;
    padding: 18px;
    color: white;
    font-size: 17px;
    outline: none;
}

textarea:focus {
    border-color: #a78bfa;
}

textarea::placeholder {
    color: #aab4d0;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 25px;
}

.stat {
    background: rgba(167,139,250,0.10);
    padding: 20px 10px;
    border-radius: 12px;
    border: 1px solid rgba(167,139,250,0.2);
}

.stat h2 {
    color: #c4b5fd;
    font-size: 28px;
    margin-bottom: 8px;
}

.stat p {
    font-size: 13px;
    color: #aab4d0;
}

.buttons {
    display: flex;
    gap: 12px;
    margin-top: 25px;
    justify-content: center;
}

button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #a78bfa;
    color: #100d25;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    transform: translateY(-3px);
    background: #c4b5fd;
}

.clear {
    background: rgba(255,255,255,0.12);
    color: white;
}

footer {
    text-align: center;
    color: #aab4d0;
    margin-top: 70px;
    font-size: 13px;
}

@media(max-width: 550px) {
    h1 { font-size: 30px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .counter-box { padding: 18px; }
}
</style>
</head>

<body>

<header>
    <div class="logo">ToolNest.</div>
    <a href="index.html">← Back to Home</a>
</header>

<div class="container">

    <h1>Name <span>Counter</span></h1>
    <p class="subtitle">
        Enter your name and discover its character statistics.
    </p>

    <div class="counter-box">

        <textarea id="nameInput"
        placeholder="Enter your name here..."
        oninput="countName()"></textarea>

        <div class="stats">

            <div class="stat">
                <h2 id="characters">0</h2>
                <p>Characters</p>
            </div>

            <div class="stat">
                <h2 id="letters">0</h2>
                <p>Letters</p>
            </div>

            <div class="stat">
                <h2 id="words">0</h2>
                <p>Words</p>
            </div>

            <div class="stat">
                <h2 id="spaces">0</h2>
                <p>Spaces</p>
            </div>

            <div class="stat">
                <h2 id="vowels">0</h2>
                <p>Vowels</p>
            </div>

            <div class="stat">
                <h2 id="consonants">0</h2>
                <p>Consonants</p>
            </div>

        </div>

        <div class="buttons">
            <button onclick="copyName()">Copy Name</button>
            <button class="clear" onclick="clearName()">Clear</button>
        </div>

    </div>
</div>

<footer>
    © 2026 ToolNest | A product by DeltaCode
</footer>

<script>

function countName() {

    const name = document.getElementById("nameInput").value;

    const letters = name.match(/\p{L}/gu) || [];
    const vowels = letters.filter(c =>
        "aeiou".includes(c.toLowerCase())
    );

    const consonants = letters.filter(c =>
        /^[a-z]$/i.test(c) &&
        !"aeiou".includes(c.toLowerCase())
    );

    const words = name.trim()
        ? name.trim().split(/\s+/).length
        : 0;

    document.getElementById("characters").textContent =
        [...name].length;

    document.getElementById("letters").textContent =
        letters.length;

    document.getElementById("words").textContent =
        words;

    document.getElementById("spaces").textContent =
        (name.match(/ /g) || []).length;

    document.getElementById("vowels").textContent =
        vowels.length;

    document.getElementById("consonants").textContent =
        consonants.length;
}

function clearName() {
    document.getElementById("nameInput").value = "";
    countName();
}

async function copyName() {
    const name = document.getElementById("nameInput").value;

    if (!name) {
        alert("Please enter a name first!");
        return;
    }

    try {
        await navigator.clipboard.writeText(name);
        alert("Name copied successfully!");
    } catch {
        alert("Copy not supported. Please copy manually.");
    }
}

</script>

</body>
</html>
