
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Free online unit converter for length, weight, temperature, area, volume, speed and time.">
<title>Unit Converter | ToolNest</title>

<style>
:root {
    --bg: #0B1020;
    --card: #171B35;
    --accent: #A78BFA;
    --blue: #38BDF8;
    --text: #FFFFFF;
    --muted: #AAB4D0;
    --border: rgba(255,255,255,0.1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    color: var(--text);
    background:
        radial-gradient(circle at 75% 15%, #292052 0%, transparent 35%),
        radial-gradient(circle at top, #25204D, var(--bg) 55%);
}

nav {
    padding: 17px 7%;
    background: rgba(11,16,32,0.88);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid var(--border);
}

nav a {
    color: var(--accent);
    font-size: 25px;
    font-weight: bold;
    text-decoration: none;
}

.brand-subtitle {
    display: block;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 4px;
}

.container {
    width: 90%;
    max-width: 750px;
    margin: 65px auto;
}

.heading {
    text-align: center;
    margin-bottom: 35px;
}

.heading h1 {
    font-size: clamp(30px, 5vw, 43px);
    margin-bottom: 12px;
}

.heading h1 span {
    color: var(--accent);
}

.heading p {
    color: var(--muted);
    line-height: 1.7;
}

.converter {
    background: rgba(23,27,53,0.85);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 30px;
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}

label {
    display: block;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 9px;
}

select, input {
    width: 100%;
    padding: 15px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 11px;
    color: white;
    outline: none;
    font-size: 15px;
}

select:focus, input:focus {
    border-color: var(--accent);
}

select option {
    background: #171B35;
    color: white;
}

.form-group {
    margin-bottom: 22px;
}

.conversion-row {
    display: grid;
    grid-template-columns: 1fr 55px 1fr;
    gap: 12px;
    align-items: end;
}

.swap-button {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(167,139,250,0.15);
    color: var(--accent);
    font-size: 23px;
    cursor: pointer;
    transition: 0.3s;
}

.swap-button:hover {
    background: var(--accent);
    color: #0B1020;
    transform: rotate(180deg);
}

.result {
    margin-top: 28px;
    padding: 24px;
    border-radius: 15px;
    border: 1px solid rgba(167,139,250,0.3);
    background: rgba(167,139,250,0.09);
    text-align: center;
}

.result small {
    color: var(--muted);
}

.result h2 {
    color: var(--accent);
    font-size: clamp(24px, 5vw, 34px);
    margin: 12px 0;
    overflow-wrap: anywhere;
}

.result p {
    color: var(--muted);
    font-size: 14px;
    overflow-wrap: anywhere;
}

.actions {
    display: flex;
    gap: 12px;
    margin-top: 22px;
}

.actions button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: 0.3s;
}

.copy-btn {
    background: var(--accent);
    color: #0B1020;
}

.clear-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border) !important;
    color: white;
}

.actions button:hover {
    transform: translateY(-3px);
}

.status {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    margin-top: 15px;
    min-height: 18px;
}

.back-link {
    display: block;
    text-align: center;
    margin-top: 28px;
    color: var(--accent);
    text-decoration: none;
}

footer {
    text-align: center;
    padding: 25px;
    color: var(--muted);
    font-size: 13px;
}

footer span {
    color: var(--accent);
}

@media(max-width: 550px) {
    .container {
        margin: 40px auto;
    }

    .converter {
        padding: 20px;
    }

    .conversion-row {
        grid-template-columns: 1fr;
    }

    .swap-button {
        margin: 0 auto;
        transform: rotate(90deg);
    }

    .swap-button:hover {
        transform: rotate(270deg);
    }

    .actions {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<nav>
    <a href="../index.html">ToolNest.</a>
    <span class="brand-subtitle">by DeltaCode</span>
</nav>

<main class="container">

    <div class="heading">
        <h1>Unit <span>Converter</span></h1>
        <p>Convert different units quickly and easily.</p>
    </div>

    <section class="converter">

        <div class="form-group">
            <label for="category">Select Category</label>
            <select id="category">
                <option value="length">Length</option>
                <option value="weight">Weight</option>
                <option value="temperature">Temperature</option>
                <option value="area">Area</option>
                <option value="volume">Volume</option>
                <option value="speed">Speed</option>
                <option value="time">Time</option>
            </select>
        </div>

        <div class="form-group">
            <label for="amount">Enter Value</label>
            <input type="number" id="amount" value="1" step="any" placeholder="Enter a number">
        </div>

        <div class="conversion-row">

            <div class="form-group">
                <label for="fromUnit">From</label>
                <select id="fromUnit"></select>
            </div>

            <button class="swap-button" id="swapButton" type="button" aria-label="Swap units">⇄</button>

            <div class="form-group">
                <label for="toUnit">To</label>
                <select id="toUnit"></select>
            </div>

        </div>

        <div class="result" aria-live="polite">
            <small>Conversion Result</small>
            <h2 id="resultValue">1000</h2>
            <p id="resultText">1 Kilometer = 1000 Meter</p>
        </div>

        <div class="actions">
            <button class="copy-btn" id="copyButton" type="button">Copy Result</button>
            <button class="clear-btn" id="clearButton" type="button">Clear</button>
        </div>

        <p class="status" id="status" role="status"></p>

    </section>

    <a href="../index.html" class="back-link">← Back to ToolNest</a>

</main>

<footer>
    © 2026 ToolNest. All rights reserved.<br>
    A Product by <span>DeltaCode</span>
</footer>

<script>
const units = {
    length: {
        Kilometer: 1000,
        Meter: 1,
        Centimeter: 0.01,
        Millimeter: 0.001,
        Mile: 1609.344,
        Foot: 0.3048,
        Inch: 0.0254
    },

    weight: {
        Kilogram: 1000,
        Gram: 1,
        Milligram: 0.001,
        Pound: 453.59237,
        Ounce: 28.349523125
    },

    temperature: {
        Celsius: "C",
        Fahrenheit: "F",
        Kelvin: "K"
    },

    area: {
        "Square Meter": 1,
        "Square Kilometer": 1000000,
        "Square Foot": 0.09290304,
        Acre: 4046.8564224,
        Hectare: 10000
    },

    volume: {
        Liter: 1,
        Milliliter: 0.001,
        "Cubic Meter": 1000,
        "US Gallon": 3.785411784
    },

    speed: {
        "Meter/Second": 1,
        "Kilometer/Hour": 1 / 3.6,
        "Mile/Hour": 0.44704
    },

    time: {
        Second: 1,
        Minute: 60,
        Hour: 3600,
        Day: 86400
    }
};

const category = document.getElementById("category");
const amount = document.getElementById("amount");
const fromUnit = document.getElementById("fromUnit");
const toUnit = document.getElementById("toUnit");
const resultValue = document.getElementById("resultValue");
const resultText = document.getElementById("resultText");
const status = document.getElementById("status");

function formatNumber(value) {
    if (Object.is(value, -0)) value = 0;

    return new Intl.NumberFormat("en-US", {
        maximumSignificantDigits: 10
    }).format(value);
}

function populateUnits() {
    const selectedCategory = category.value;
    const names = Object.keys(units[selectedCategory]);

    fromUnit.innerHTML = "";
    toUnit.innerHTML = "";

    names.forEach(name => {
        fromUnit.add(new Option(name, name));
        toUnit.add(new Option(name, name));
    });

    if (names.length > 1) {
        fromUnit.selectedIndex = 0;
        toUnit.selectedIndex = 1;
    }

    convert();
}

function convertTemperature(value, from, to) {
    let celsius;

    if (from === "Celsius") {
        celsius = value;
    } else if (from === "Fahrenheit") {
        celsius = (value - 32) * 5 / 9;
    } else {
        celsius = value - 273.15;
    }

    if (to === "Celsius") return celsius;
    if (to === "Fahrenheit") return (celsius * 9 / 5) + 32;
    return celsius + 273.15;
}

function convert() {
    const value = Number(amount.value);
    const from = fromUnit.value;
    const to = toUnit.value;

    if (amount.value.trim() === "" || !Number.isFinite(value)) {
        resultValue.textContent = "Enter a value";
        resultText.textContent = "Please enter a valid number.";
        return;
    }

    let answer;

    if (category.value === "temperature") {
        answer = convertTemperature(value, from, to);
    } else {
        const conversionUnits = units[category.value];
        answer = value * conversionUnits[from] / conversionUnits[to];
    }

    if (!Number.isFinite(answer)) {
        resultValue.textContent = "Invalid result";
        resultText.textContent = "Please check your input.";
        return;
    }

    resultValue.textContent = formatNumber(answer);
    resultText.textContent =
        `${formatNumber(value)} ${from} = ${formatNumber(answer)} ${to}`;

    status.textContent = "";
}

category.addEventListener("change", populateUnits);
amount.addEventListener("input", convert);
fromUnit.addEventListener("change", convert);
toUnit.addEventListener("change", convert);

document.getElementById("swapButton").addEventListener("click", () => {
    const oldFrom = fromUnit.value;
    fromUnit.value = toUnit.value;
    toUnit.value = oldFrom;
    convert();
});

document.getElementById("copyButton").addEventListener("click", async () => {
    const text = resultText.textContent;

    if (text.includes("Please enter") || text.includes("Please check")) {
        status.textContent = "Enter a valid value first.";
        return;
    }

    try {
        await navigator.clipboard.writeText(text);
        status.textContent = "Result copied successfully!";
    } catch (error) {
        status.textContent = "Copy is unavailable in this browser.";
    }
});

document.getElementById("clearButton").addEventListener("click", () => {
    amount.value = "";
    resultValue.textContent = "—";
    resultText.textContent = "Enter a value to convert.";
    status.textContent = "";
    amount.focus();
});

populateUnits();
</script>

</body>
</html>
